<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Characters Animations </title>
    <style>
        body {
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
            .container {
                overflow-x: hidden;
                width: 100vw;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: black;
                div{
                    width: 200px;
                    background-repeat: no-repeat;
                }
                .animation00 {
                    height: 200px;
                    background-image: url('./FinalAnimation.jpg');
                    animation: effect00 4s steps(28) 0s infinite;
                }
                .animation01 {
                    height: 900px;
                    background-image: url('./orignal.jpeg');
                    animation: effect01 2s steps(8) 0s infinite;
                }
                .animation02 {
                    height: 400px;
                    width: 100px;
                    background-image: url('./orignalImageRemoveBG.png');
                    background-size: cover;
                    background-position: 100px;
                    animation: effect02 2s steps(8) 0s infinite;
                }
                .animation03 {
                    height: 200px;
                    background-image: url('./1.png'), url('./2.png'), url('./3.png'), url('./4.png');
                    animation: effect03 1s steps(8) 0s infinite;
                }
                .animation04 {
                    width: 176px;
                    display: flex;
                    align-items: center;
                    position: relative;
                    overflow: hidden;
                    animation: effect04 2s steps(28) 0s infinite;
                }
            }
        }
        @keyframes effect00 {
            from {
                background-position: 0px;
            }to {
                background-position: -5200px;
            }
        }
        @keyframes effect01 {
            from {
                background-position: 0px;
            }to {
                background-position: -770px;
            }
        }
        @keyframes effect02 {
            from {
                background-position: 0px;
            }to {
                background-position: -361px;
            }
        }
        @keyframes effect03 {
            from {
                background-position: 0px;
            }to {
                background-position: -361px;
            }
        }
        @keyframes effect04 {
            from {
                justify-content: start;
            }to {
                justify-content: end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="animation00"></div>
        <div class="animation01"></div>
        <div class="animation02"></div>
        <div class="animation03"></div>
        <div class="animation04">
            <img src="./1.png" alt="imageAnimations">
            <img src="./2.png" alt="imageAnimations">
            <img src="./3.png" alt="imageAnimations">
            <img src="./4.png" alt="imageAnimations">
        </div>
    </div>
</body>
</html>
